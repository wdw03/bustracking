# ============================================================================
# BusTracker: Supabase Project Configuration
# ============================================================================

[project]
id = "aqknhfzktrsyndlgfcpy"
name = "BusTracker"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["exp://localhost:8081"]

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = true

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MB"

# ── Edge Functions ──
[functions.register-user]
verify_jwt = false

[functions.bus-proximity]
verify_jwt = false

[functions.send-notification]
verify_jwt = false

[functions.google-play-webhook]
verify_jwt = false

[functions.subscription-check]
verify_jwt = false

[functions.admin-actions]
verify_jwt = true
